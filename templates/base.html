<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Drowsiness Detection{% endblock %}</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='icon.jpeg') }}">
    <!-- Non-blocking Google Fonts (Step 7 — Render Deployment Guide) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin/>
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"/>
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"/>
    </noscript>
    <!-- defer stops Lucide from blocking HTML parsing (Step 8) -->
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <style>
        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --secondary: #EFF6FF;
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --danger-bg: #FEF2F2;
            --success: #10B981;
            --success-bg: #ECFDF5;
            --bg-body: #F8FAFC;
            --bg-surface: #FFFFFF;
            --text-main: #0F172A;
            --text-soft: #64748B;
            --border-light: #E2E8F0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }

        .sidebar-header {
            padding: 32px 24px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary), #60A5FA);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .nav-links {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            color: var(--text-soft);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-item:hover {
            color: var(--text-main);
            background-color: var(--bg-body);
            transform: translateX(4px);
        }

        .nav-item.active {
            background-color: var(--secondary);
            color: var(--primary);
        }

        .nav-item.active .lucide {
            stroke: var(--primary);
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            flex-grow: 1;
            min-height: 100vh;
            padding: 48px;
        }

        .page-header {
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .page-header p {
            color: var(--text-soft);
            font-size: 1.05rem;
        }

        /* Card Components */
        .card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            padding: 32px;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        /* Button Components */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
            letter-spacing: 0.01em;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.35);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(239, 68, 68, 0.35);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(16px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-icon">
                <i data-lucide="shield-check"></i>
            </div>
            <div class="brand-title">Safety AI</div>
        </div>
        <nav class="nav-links" style="margin-top: 24px;">
            <a href="{{ url_for('index') }}" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
                <i data-lucide="layout-dashboard"></i>
                Dashboard
            </a>
            <a href="{{ url_for('about') }}" class="nav-item {% if request.endpoint == 'about' %}active{% endif %}">
                <i data-lucide="info"></i>
                About System
            </a>
            <a href="{{ url_for('about_contact') }}" class="nav-item {% if request.endpoint == 'about_contact' %}active{% endif %}">
                <i data-lucide="user"></i>
                About & Contact
            </a>
        </nav>
        <div style="padding: 24px; margin-top: auto;">
            <div style="background: var(--bg-body); padding: 20px; border-radius: var(--radius-md); text-align: center; border: 1px solid var(--border-light);">
                <i data-lucide="activity" style="color: var(--primary); margin-bottom: 8px;"></i>
                <p style="font-size: 0.875rem; font-weight: 600; color: var(--text-main);">Pro Version Active</p>
                <p style="font-size: 0.75rem; color: var(--text-soft); margin-top: 4px;">Real-time Drowsiness Eng.</p>
            </div>
        </div>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script>
        lucide.createIcons();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
